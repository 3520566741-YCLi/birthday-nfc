<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f1e4f4">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="description" content="A little surprise.">
<!-- Favicon is inline (no external request, no extra file). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<title>A little surprise</title>
<link rel="preload" href="assets/fonts/Courgette-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/MaShanZheng-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/ZhiMangXing-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=glass-24">
</head>
<body>

  <canvas id="liquidBackdrop" class="liquid-backdrop" aria-hidden="true"></canvas>

  <div class="ambient" aria-hidden="true">
    <span class="orb orb--1"></span>
    <span class="orb orb--2"></span>
    <span class="orb orb--3"></span>
  </div>

  <!-- Fired only on unlock. JS checks prefers-reduced-motion before creating anything. -->
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <main class="stage">

    <!-- ============ The unlocked gift (hidden until the password matches) ============ -->
    <section id="gift" class="gift paper" aria-labelledby="giftTitle" hidden>

      <header class="gift__head">
        <p class="gift__kicker">🎁</p>
        <h1 class="gift__title"><span id="giftTitle"></span><svg class="cake" viewBox="0 0 64 70" aria-hidden="true">
          <defs>
            <radialGradient id="flameG" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff7c2"/><stop offset=".55" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff8a3d"/></radialGradient>
            <radialGradient id="glowG"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
          </defs>
          <!-- candles -->
          <g class="cake__candles">
            <rect x="19" y="18" width="5" height="15" rx="2" fill="#b9a3ff"/><path d="M19 22 l5 -2 M19 27 l5 -2" stroke="#fff" stroke-width="1.4" opacity=".8"/>
            <rect x="29.5" y="15" width="5" height="18" rx="2" fill="#ff8fb2"/><path d="M29.5 19 l5 -2 M29.5 24 l5 -2 M29.5 29 l5 -2" stroke="#fff" stroke-width="1.4" opacity=".8"/>
            <rect x="40" y="18" width="5" height="15" rx="2" fill="#8fd3ff"/><path d="M40 22 l5 -2 M40 27 l5 -2" stroke="#fff" stroke-width="1.4" opacity=".8"/>
          </g>
          <g class="cake__flames">
            <circle class="cake__glow" cx="21.5" cy="12" r="7" fill="url(#glowG)"/><circle class="cake__glow" cx="32" cy="9" r="7" fill="url(#glowG)"/><circle class="cake__glow" cx="42.5" cy="12" r="7" fill="url(#glowG)"/>
            <path class="cake__flame cake__flame--1" d="M21.5 8 C24 11 24.3 13.6 21.5 15.6 C18.7 13.6 19 11 21.5 8 Z" fill="url(#flameG)"/>
            <path class="cake__flame cake__flame--2" d="M32 5 C34.5 8 34.8 10.6 32 12.6 C29.2 10.6 29.5 8 32 5 Z" fill="url(#flameG)"/>
            <path class="cake__flame cake__flame--3" d="M42.5 8 C45 11 45.3 13.6 42.5 15.6 C39.7 13.6 40 11 42.5 8 Z" fill="url(#flameG)"/>
          </g>
          <!-- top tier -->
          <rect x="14" y="32" width="36" height="14" rx="6" fill="#fff4f7"/>
          <path d="M14 38 q0 -6 6 -6 h24 q6 0 6 6 v1 q-3 3 -5 0 q-3 4 -6 0 q-3 4 -6 0 q-3 4 -6 0 q-3 4 -6 0 q-2 3 -3 0 z" fill="#ff9cc0"/>
          <!-- bottom tier -->
          <rect x="6" y="45" width="52" height="19" rx="7" fill="#ffe3ec"/>
          <path d="M6 52 q0 -7 7 -7 h38 q7 0 7 7 v1 q-3 4 -6 0 q-3 5 -6.5 0 q-3 5 -6.5 0 q-3 5 -6.5 0 q-3 5 -6.5 0 q-3 5 -6.5 0 q-3 4 -5 0 z" fill="#c9b2ff"/>
          <!-- sprinkles -->
          <g stroke-linecap="round" stroke-width="1.8">
            <path d="M20 41 l2 -1" stroke="#ffcf4d"/><path d="M30 42 l1.6 1.4" stroke="#8fd3ff"/><path d="M40 41 l2 1" stroke="#9a7cff"/>
            <path d="M13 58 l2 -1.2" stroke="#ff6fa3"/><path d="M24 59 l1.8 1.2" stroke="#ffcf4d"/><path d="M35 58 l2 -1" stroke="#8fd3ff"/><path d="M47 59 l1.6 1.4" stroke="#ff6fa3"/>
          </g>
          <!-- plate -->
          <rect x="2" y="63" width="60" height="4" rx="2" fill="#fff" opacity=".95"/>
          <rect x="2" y="66" width="60" height="2" rx="1" fill="#e9d6e6"/>
        </svg></h1>
        <p class="gift__sub" data-cfg="gift.subtitle"></p>
      </header>

      <!-- Main photo -->
      <figure id="photoBlock" class="photo" hidden>
        <div class="photo__frame">
          <img id="mainPhoto" class="photo__img" alt="" loading="eager" decoding="async">
        </div>
        <figcaption id="mainPhotoCaption" class="photo__caption"></figcaption>
      </figure>

      <!-- Birthday letter -->
      <article id="messageBlock" class="letter">
        <div id="messageBody" class="letter__body"></div>
        <p class="letter__sign">
          <span class="letter__dash">—</span>
          <span id="senderName"></span>
        </p>
        <p class="letter__date" data-cfg="date"></p>
      </article>

      <!-- Music -->
      <div id="musicBlock" class="block" hidden>
        <button id="musicBtn" class="pill glass" data-glass="button" type="button" aria-expanded="false" aria-controls="musicPanel">
          <span class="pill__icon" aria-hidden="true">🎵</span>
          <span class="pill__label" data-cfg="music.buttonLabel"></span>
        </button>
        <div id="musicPanel" class="panel" hidden>
          <div id="musicEmbed" class="embed" hidden></div>
          <audio id="musicAudio" class="audio" controls playsinline preload="none" hidden></audio>
          <p id="musicNote" class="panel__note" data-cfg="music.note" hidden></p>
        </div>
      </div>

      <!-- Photo gallery -->
      <div id="galleryBlock" class="block" hidden>
        <h2 class="block__title" data-cfg="gallery.title"></h2>
        <ul id="galleryList" class="gallery"></ul>
      </div>

      <!-- Hidden video -->
      <div id="videoBlock" class="block" hidden>
        <button id="videoBtn" class="pill glass" data-glass="button" type="button" aria-expanded="false" aria-controls="videoPanel">
          <span class="pill__icon" aria-hidden="true">🎬</span>
          <span class="pill__label" data-cfg="video.buttonLabel"></span>
        </button>
        <div id="videoPanel" class="panel" hidden>
          <div id="videoEmbed" class="embed embed--video" hidden></div>
          <video id="videoFile" class="video" controls playsinline preload="none" hidden></video>
        </div>
      </div>

      <!-- Easter egg -->
      <div id="eggBlock" class="block" hidden>
        <button id="eggBtn" class="pill pill--ghost" type="button" aria-expanded="false" aria-controls="eggPanel">
          <span class="pill__icon" aria-hidden="true">🥚</span>
          <span class="pill__label" data-cfg="egg.buttonLabel"></span>
        </button>
        <div id="eggPanel" class="panel panel--egg" hidden>
          <h2 id="eggTitle" class="block__title"></h2>
          <div id="eggBody" class="letter__body letter__body--small"></div>
        </div>
      </div>

      <div class="footnote balloons" aria-hidden="true">
        <svg viewBox="0 0 120 92" width="78" height="60">
          <defs>
            <radialGradient id="bShine" cx=".34" cy=".3" r=".75">
              <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
              <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g class="balloon balloon--1">
            <path d="M30 52 C 29 62, 34 70, 31 80 S 33 88, 36 91" class="balloon__string"/>
            <ellipse cx="30" cy="30" rx="15" ry="19" fill="#9a7cff"/>
            <ellipse cx="30" cy="30" rx="15" ry="19" fill="url(#bShine)"/>
            <path d="M27 49 L33 49 L30 53 Z" fill="#9a7cff"/>
          </g>
          <g class="balloon balloon--2">
            <path d="M60 43 C 62 55, 57 66, 60 76 S 58 86, 60 91" class="balloon__string"/>
            <ellipse cx="60" cy="21" rx="16" ry="20" fill="#ff6fa3"/>
            <ellipse cx="60" cy="21" rx="16" ry="20" fill="url(#bShine)"/>
            <path d="M57 41 L63 41 L60 45 Z" fill="#ff6fa3"/>
          </g>
          <g class="balloon balloon--3">
            <path d="M90 55 C 92 64, 86 72, 89 81 S 86 88, 84 91" class="balloon__string"/>
            <ellipse cx="90" cy="34" rx="14" ry="18" fill="#ffc35c"/>
            <ellipse cx="90" cy="34" rx="14" ry="18" fill="url(#bShine)"/>
            <path d="M87 52 L93 52 L90 56 Z" fill="#ffc35c"/>
          </g>
        </svg>
      </div>
    </section>

    <!-- ============ The envelope (between the lock screen and the letter) ============ -->
    <section id="envelope" class="envelope" hidden>
      <div class="envelope__scene" id="envelopeScene">
        <svg class="envelope__back" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 0 H300 V193 Q300 200 293 200 H7 Q0 200 0 193 Z" fill="#eadbcd"/>
          <path d="M0 0 H300 L150 120 Z" fill="#e2d1c1"/>
        </svg>
        <!-- the folded letter is built here from the real letter page by script.js -->
        <svg class="envelope__pocket" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="sideL" x1="0" x2="1"><stop offset="0" stop-color="#f1e5d9"/><stop offset="1" stop-color="#ebdccd"/></linearGradient>
            <linearGradient id="sideR" x1="1" x2="0"><stop offset="0" stop-color="#f1e5d9"/><stop offset="1" stop-color="#ebdccd"/></linearGradient>
            <linearGradient id="bottomFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8efe6"/><stop offset="1" stop-color="#f4e8dc"/></linearGradient>
          </defs>
          <path d="M0 2 L136 122 L0 200 Z" fill="url(#sideL)"/>
          <path d="M300 2 L164 122 L300 200 Z" fill="url(#sideR)"/>
          <path d="M0 2 L136 122 M300 2 L164 122" fill="none" stroke="#c9ad98" stroke-opacity=".28" stroke-width="1" vector-effect="non-scaling-stroke"/>
          <path d="M0 200 L150 104 L300 200 Z" fill="url(#bottomFlap)"/>
          <path d="M0 200 L150 104 L300 200" fill="none" stroke="#c9ad98" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="envelope__front" aria-hidden="true">
          <p class="envelope__to">DEAR FRIEND</p>
          <p class="envelope__from">HAPPY BIRTHDAY &middot; 2026</p>
        </div>
        <svg class="envelope__stamp" viewBox="0 0 60 72" aria-hidden="true">
          <defs>
            <mask id="perf"><rect width="60" height="72" fill="#fff"/>
              <g fill="#000"><circle cx="0" cy="6" r="2.4"/><circle cx="0" cy="18" r="2.4"/><circle cx="0" cy="30" r="2.4"/><circle cx="0" cy="42" r="2.4"/><circle cx="0" cy="54" r="2.4"/><circle cx="0" cy="66" r="2.4"/>
                <circle cx="60" cy="6" r="2.4"/><circle cx="60" cy="18" r="2.4"/><circle cx="60" cy="30" r="2.4"/><circle cx="60" cy="42" r="2.4"/><circle cx="60" cy="54" r="2.4"/><circle cx="60" cy="66" r="2.4"/>
                <circle cx="6" cy="0" r="2.4"/><circle cx="18" cy="0" r="2.4"/><circle cx="30" cy="0" r="2.4"/><circle cx="42" cy="0" r="2.4"/><circle cx="54" cy="0" r="2.4"/>
                <circle cx="6" cy="72" r="2.4"/><circle cx="18" cy="72" r="2.4"/><circle cx="30" cy="72" r="2.4"/><circle cx="42" cy="72" r="2.4"/><circle cx="54" cy="72" r="2.4"/></g>
            </mask>
          </defs>
          <g mask="url(#perf)">
            <rect width="60" height="72" fill="#fffaf3"/>
            <rect x="5" y="5" width="50" height="62" fill="#f3d9e6"/>
            <rect x="15" y="38" width="30" height="15" rx="2" fill="#fff6ee"/>
            <rect x="15" y="38" width="30" height="5" rx="2" fill="#ff8fb2"/>
            <rect x="12" y="52" width="36" height="3" rx="1.5" fill="#c9a0b4"/>
            <rect x="21" y="28" width="2.4" height="10" rx="1" fill="#9a7cff"/><rect x="28.8" y="26" width="2.4" height="12" rx="1" fill="#ffb347"/><rect x="36.6" y="28" width="2.4" height="10" rx="1" fill="#9a7cff"/>
            <ellipse cx="22.2" cy="25.6" rx="1.6" ry="2.6" fill="#ffc24a"/><ellipse cx="30" cy="23.6" rx="1.6" ry="2.6" fill="#ffc24a"/><ellipse cx="37.8" cy="25.6" rx="1.6" ry="2.6" fill="#ffc24a"/>
            <text x="30" y="16" text-anchor="middle" font-size="7" font-weight="700" fill="#b0507a" letter-spacing=".8">2026</text>
            <text x="30" y="63.5" text-anchor="middle" font-size="5" fill="#8a5a6a" letter-spacing=".6">BIRTHDAY</text>
          </g>
        </svg>
        <svg class="envelope__postmark" viewBox="0 0 100 100" aria-hidden="true">
          <defs><path id="pmRing" d="M50 50 m-35 0 a35 35 0 1 1 70 0 a35 35 0 1 1 -70 0"/></defs>
          <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="50" cy="50" r="27" fill="none" stroke="currentColor" stroke-width="1.1"/>
          <text font-size="10" letter-spacing="2" fill="currentColor"><textPath href="#pmRing">BIRTHDAY POST &#183; BIRTHDAY POST &#183;</textPath></text>
          <text x="50" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">2026</text>
          <text x="50" y="62" text-anchor="middle" font-size="8" letter-spacing="1.6" fill="currentColor">OCT</text>
          <path d="M-60 40 q15 -6 30 0 t30 0 t30 0 M-60 52 q15 -6 30 0 t30 0 t30 0 M-60 64 q15 -6 30 0 t30 0 t30 0" fill="none" stroke="currentColor" stroke-width="1.4" transform="translate(-6 -2)"/>
        </svg>
        <span class="envelope__flap" aria-hidden="true">
          <svg viewBox="0 0 300 128" preserveAspectRatio="none">
            <defs><linearGradient id="flapG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe2d5"/><stop offset="1" stop-color="#f5ebe1"/></linearGradient></defs>
            <path d="M0 0 H300 L158 122 Q150 128 142 122 Z" fill="url(#flapG)" stroke="#c9ad98" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/>
          </svg>
        </span>
        <span class="envelope__seal" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="10.6" y="10.4" width="2.8" height="8.6" rx="1" fill="#fff" fill-opacity=".9"/>
            <path d="M12 4c1.8 2.2 2.3 3.4 2.3 4.3a2.3 2.3 0 0 1-4.6 0c0-.9.5-2.1 2.3-4.3z" fill="#ffe7a8"/>
          </svg>
        </span>
      </div>
      <button id="envelopeBtn" class="envelope__btn" type="button" data-cfg-aria="envelope.ariaLabel">
        <span class="envelope__arrow" aria-hidden="true"></span>
        <span id="envelopeHint" data-cfg="envelope.hint"></span>
      </button>
    </section>

    <!-- ============ The lock screen ============ -->
    <section id="gate" class="gate" aria-labelledby="gateTitle">
      <div class="gate__inner glass" data-glass="card">
        <div class="gate__icon" aria-hidden="true">🎁</div>
        <h1 id="gateTitle" class="gate__title" data-cfg="gate.title"></h1>
        <p class="gate__sub" data-cfg="gate.subtitle"></p>

        <form id="gateForm" class="gate__form" autocomplete="off" novalidate>
          <label class="sr-only" for="birthdayInput" data-cfg-aria="gate.inputAriaLabel"></label>
          <span class="field glass" data-glass="field">
          <input
            id="birthdayInput"
            class="gate__input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            enterkeyhint="go"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="MMDD"
            aria-describedby="gateHint gateError">
          </span>
          <button id="gateSubmit" class="gate__btn glass" data-glass="button" type="submit">
            <span data-cfg="gate.buttonLabel"></span>
          </button>
        </form>

        <p id="gateHint" class="gate__hint" data-cfg="gate.hint"></p>
        <p id="gateError" class="gate__error" role="alert" aria-live="polite"></p>
      </div>
    </section>

  </main>

  <script src="script.js?v=glass-24"></script>
  <script src="glass.js?v=glass-11"></script>
</body>
</html>
